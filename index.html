<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explainable credit underwriting: calibrated probability of default, policy decisioning, model comparison, portfolio analytics, monitoring, and governance."
    />
    <meta name="theme-color" content="#062f2d" />
    <title>Explainable Credit Underwriting</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1a1a; color: #eaf1ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { height: 100%; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; background: #0b1a1a; z-index: 1;
      }
      #boot .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(234, 241, 239, 0.15);
        border-top-color: #4fd1c5;
        animation: spin 1s linear infinite;
      }
      #boot .msg { font-size: 14px; letter-spacing: 0.02em; opacity: 0.8; text-align: center; padding: 0 20px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring" aria-hidden="true"></div>
      <div class="msg">Loading application&hellip; first load may take 20&ndash;40 seconds while scientific libraries install in your browser.</div>
    </div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      const u = (p) => ({ url: p });

      mount(
        {
          entrypoint: "Home.py",
          requirements: ["plotly", "scikit-learn", "joblib", "PyYAML"],
          files: {
            "Home.py": u("./Home.py"),
            "common.py": u("./common.py"),
            "runtime_guard.py": u("./runtime_guard.py"),

            "pages/1_Applicant_Decision.py": u("./pages/1_Applicant_Decision.py"),
            "pages/2_What_If_Simulator.py": u("./pages/2_What_If_Simulator.py"),
            "pages/3_Model_Comparison.py": u("./pages/3_Model_Comparison.py"),
            "pages/4_Portfolio_Analytics.py": u("./pages/4_Portfolio_Analytics.py"),
            "pages/5_Monitoring.py": u("./pages/5_Monitoring.py"),
            "pages/6_Model_Governance.py": u("./pages/6_Model_Governance.py"),

            "credit_risk/__init__.py": u("./credit_risk/__init__.py"),
            "credit_risk/config.py": u("./credit_risk/config.py"),
            "credit_risk/data.py": u("./credit_risk/data.py"),
            "credit_risk/decisioning.py": u("./credit_risk/decisioning.py"),
            "credit_risk/features.py": u("./credit_risk/features.py"),
            "credit_risk/modeling.py": u("./credit_risk/modeling.py"),
            "credit_risk/monitoring.py": u("./credit_risk/monitoring.py"),

            "configs/model.yaml": u("./configs/model.yaml"),
            "configs/policy.yaml": u("./configs/policy.yaml"),

            "artifacts/model_bundle.joblib": u("./artifacts/model_bundle.joblib"),
            "artifacts/test_predictions.csv": u("./artifacts/test_predictions.csv"),
          },
        },
        document.getElementById("root"),
      );

      const hideBoot = () => {
        const b = document.getElementById("boot");
        if (b) b.style.display = "none";
      };
      const observer = new MutationObserver(() => {
        if (document.querySelector('[data-testid="stAppViewContainer"], .stApp')) {
          hideBoot();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });
      setTimeout(hideBoot, 90000);
    </script>
  </body>
</html>
